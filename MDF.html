<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>微信直充活动销售对比</title>
    <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
        }
        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50%, 1fr));
            gap: 10px;
            max-width: 1500px;
            margin: 15px auto 20px;
            padding: 10px;
        }
        .chart-box {
            border-radius: 8px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }
        .chart {
            width: 100%;
            height: 45vh;
        }
    </style>
</head>
<body>
<div class="chart-container">
    <div class="chart-box">
        <div id="lineChart" class="chart"></div>
    </div>
    <div class="chart-box">
        <div id="line2Chart" class="chart"></div>
    </div>
    <div class="chart-box">
        <div id="line3Chart" class="chart"></div>
    </div>
    <div class="chart-box">
        <div id="line4Chart" class="chart"></div>
    </div>
</div>
<script>
    const lineChart = echarts.init(document.getElementById('lineChart'));
    const line2Chart = echarts.init(document.getElementById('line2Chart'));
    const line3Chart = echarts.init(document.getElementById('line3Chart'));
    const line4Chart = echarts.init(document.getElementById('line4Chart'));

    // 颜色调色板（当活动名称不在colorMap中时自动分配）
    const PALETTE = [
        '#FF9F7F', '#FFDB5C',
        '#E690D1', '#5470C6', '#FC8452', '#9FE6B8', '#73C0DE'
    ];

    // 当前活动名称（从data.json的seriesData最后一个key获取）
    let CURRENT_ACTIVITY = '';

    // 自定义颜色映射（从data.json加载）
    let colorMap = {};

    // 图表标题（从data.json加载）
    let titles = {};

    //图表1Y轴名称（从data.json加载)
    let yTitle = '';

    // 获取活动颜色（灵活通用，新增活动自动分配颜色）
    function getColor(name) {
        if (colorMap[name]) {
            return colorMap[name];
        }
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % PALETTE.length;
        return PALETTE[index];
    }

    // JSON文件名（与HTML文件同目录）
    const DATA_FILE = 'data.json?v=' + new Date().getTime();

    // 默认数据 - 图表1
    let times = [];
    let seriesData = {};
    let MDFsales = 100;

    // 默认数据 - 图表2 (增粉数据)
    let followerSeriesData = {};

    // 默认数据 - 图表3 (ARPU)
    let arpuSeriesData = {};

    // 默认数据 - 图表4 (CC)
    let ccSeriesData = {};
    let ccTimes = {};

    // 加载JSON文件（返回数据但不更新图表）
    async function loadDataFile() {
        try {
            const response = await fetch(DATA_FILE);
            if (!response.ok) {
                console.warn(`未找到 ${DATA_FILE}，使用默认数据`);
                return false;
            }
            const data = await response.json();

            if (data.times && data.seriesData) {
                times = data.times;
                seriesData = data.seriesData;
                MDFsales = data.mdf;
                // 当前活动名称取自seriesData最后一个数据
                const seriesKeys = Object.keys(seriesData);
                CURRENT_ACTIVITY = seriesKeys[seriesKeys.length - 1];
            }

            // 加载增粉数据
            if (data.followerData) {
                followerSeriesData = data.followerData;
            }

            // 加载ARPU数据
            if (data.arpuData) {
                arpuSeriesData = data.arpuData;
            }

            // 加载CC数据
            if (data.ccData) {
                ccSeriesData = data.ccData;
                ccTimes = data.ccTimes;
            }

            // 加载颜色映射
            if (data.colorMap) {
                colorMap = data.colorMap;
            }

            // 加载图表标题
            if (data.titles) {
                titles = data.titles;
            }

            //加载图表1 Y轴名称
            if(data.yTitle){
                yTitle = data.yTitle;
            }

            return true;
        } catch (error) {
            console.error('加载数据失败:', error);
            return false;
        }
    }

    // 构建series数据 - 图表1
    function buildSeries() {
        const result = Object.keys(seriesData).map(name => ({
            name: name,
            type: 'line',
            symbolSize: 6,
            itemStyle: {
                color: getColor(name)
            },
            data: seriesData[name]
        }));
        return result;
    }

    // 构建series数据 - 图表2 (增粉)
    function buildFollowerSeries() {
        return Object.keys(followerSeriesData).map(name => ({
            name: name,
            type: 'line',
            symbolSize: 6,
            itemStyle: {
                color: getColor(name)
            },
            data: followerSeriesData[name]
        }));
    }

    // 构建series数据 - 图表3 (ARPU)
    function buildARPUSeries() {
        const result = Object.keys(arpuSeriesData).map(name => {
            if (name === CURRENT_ACTIVITY) {
                const s = {
                    name: name,
                    type: 'line',
                    symbolSize: 6,
                    itemStyle: {
                        color: getColor(name)
                    },
                    data: arpuSeriesData[name]
                };
                return s
            }else{
                const s = {
                    name: name,
                    type: 'line',
                    symbolSize: 0,
                    lineStyle: {
                        type: 'dashed',
                        width: 1
                    },
                    itemStyle: {
                        color: getColor(name)
                    },
                    data: arpuSeriesData[name]
                };
                return s
            }

        });
        return result;
    }

    // 构建series数据 - 图表4 (CC)
    function buildCCSeries() {
        const result = Object.keys(ccSeriesData).map(name => ({
            name: name,
            type: 'line',
            symbolSize: 6,
            itemStyle: {
                color: getColor(name)
            },
            data: ccSeriesData[name]
        }));
        return result;
    }

    // 更新图表
    function updateChart() {
        const currentActivityData = seriesData[CURRENT_ACTIVITY];

        // 构建series数据
        let series = Object.keys(seriesData).map(name => {
            const s = {
                name: name,
                type: 'line',
                symbolSize: 6,
                itemStyle: {
                    color: getColor(name)
                },
                data: seriesData[name]
            };

            // 为当前活动添加标注
            if (name === CURRENT_ACTIVITY && currentActivityData && currentActivityData.length > 0) {
                const lastIndex = currentActivityData.length - 1;
                const lastValue = currentActivityData[lastIndex];
                const lastTime = times[lastIndex];
                const mobile = isMobile();

                // 最后一个节点显示在上方，其他显示在右侧
                const position = lastIndex >= (times.length - 4) ? 'insideBottomLeft' : 'insideTopRight';
                const verticalAlign = position === 'insideBottomLeft' ? 'top' : 'bottom';
                const align = position === 'insideBottomLeft' ? 'right' : 'left';
                const activityColor = getColor(CURRENT_ACTIVITY);
                s.markPoint = {
                    symbol: 'circle',
                    symbolSize: 0,
                    label: {
                        show: true,
                        position: position,
                        verticalAlign:verticalAlign,
                        align: align,
                        formatter: 'Cumulative MDF\n￥'+MDFsales,
                        fontSize: mobile? 12:14,
                        color:activityColor,
                        backgroundColor: 'rgba(50,50,50,0.9)',
                        borderColor: '#777',
                        borderWidth: 1,
                        borderRadius: 2,
                        padding: [2,5],
                        distance:-5,
                        lineHeight:mobile? 15:20
                    },
                    data: [
                        { type: 'max'}
                    ]
                };
            }
            return s;
        });

        lineChart.setOption({
            xAxis: { data: times },
            series: series
        });

        // 更新图表2
        const followerSeries = buildFollowerSeries();
        line2Chart.setOption({
            xAxis: { data: times },
            series: followerSeries,
        });

        // 更新图表3
        const arpuSeries = buildARPUSeries();
        line3Chart.setOption({
            xAxis: { data: times },
            series: arpuSeries
        });

        // 更新图表4
        const ccSeries = buildCCSeries();
        line4Chart.setOption({
            xAxis: { data: ccTimes },
            series: ccSeries
        });
    }

    // 检测是否为移动端
    function isMobile() {
        return window.innerWidth <= 768;
    }

    function initChart() {
        const series = buildSeries();
        const mobile = isMobile();
        const option = {
            textStyle: {
                color: '#ffffff',
                fontFamily: 'Helvetica',
                fontSize: mobile ? 12 : 14
            },
            title: {
                text: titles.sales + ' (默认数据)',
                left: 'center',
                top: mobile ? 5 : 5,
                textStyle: {
                    color: '#ffffff',
                    fontSize: mobile ? 14 : 16
                }
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross',
                    label: {
                        backgroundColor: '#6a7985'
                    }
                },
                confine:true,
                backgroundColor: 'rgba(50,50,50,0.9)',
                borderColor: '#777',
                borderWidth: 1,
                textStyle: { color: '#fff' },
                formatter: function(params) {
                    let result = `<b>${params[0].axisValue}</b><br/>`;
                    let total = 0;
                    params.forEach(item => {
                        if (item.value > 0) {
                            result += `${item.marker} ${item.seriesName}: ${item.value}%<br/>`;
                            total += item.value;
                        }
                    });
                    return result;
                }
            },
            legend: {
                orient: mobile ? 'horizontal':'horizontal',
                left: 'center',
                bottom: mobile ? -5 : 0,
                top: 'auto',
                itemGap: mobile ? 6 : 15,
                itemWidth: mobile ? 16 : 25,
                itemHeight: mobile ? 10 : 14,
                textStyle: {
                    color: '#ccc',
                    fontSize: mobile ? 9 : 14
                }
            },
            grid: {
                left: mobile ? '5%' : '3%',
                right: mobile ? '5%' : '3%',
                top: mobile ? '20%' : '20%',
                bottom: mobile ? '7%' : '7%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: times,
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 14,
                    rotate: mobile ? 45 : 0
                },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                name: '',
                nameLocation: 'end',
                nameTextStyle: {
                    color: '#ffffff',
                    fontSize: mobile ? 10 : 14,
                    fontFamily: 'Helvetica',
                    align: 'right'
                },
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 14,
                    formatter: function(value) {
                        return value.toFixed(0)+"%";
                    }
                },
                splitLine: { lineStyle: { color: '#333333' } }
            },
            graphic: {
                elements: [{
                    type: 'text',
                    left: mobile ? '4%' : '2%',
                    top: mobile ? '12%' : '10%',
                    style: {
                        text: '销售占比'+yTitle,
                        fill: '#ffffff',
                        fontSize: mobile ? 10 : 14,
                        fontFamily: 'Helvetica'
                    }
                }]
            },
            series: series
        };

        lineChart.setOption(option);
    }

    // 初始化图表2 (增粉图表)
    function initFollowerChart() {
        const series = buildFollowerSeries();
        const mobile = isMobile();
        const option = {
            textStyle: {
                color: '#ffffff',
                fontFamily: 'Helvetica',
                fontSize: mobile ? 12 : 14
            },
            title: {
                text: CURRENT_ACTIVITY + ' ' + titles.follower,
                left: 'center',
                top: mobile ? 5 : 5,
                textStyle: {
                    color: '#ffffff',
                    fontSize: mobile ? 14 : 16
                }
            },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(50,50,50,0.9)',
                borderColor: '#777',
                borderWidth: 1,
                confine:true,
                textStyle: { color: '#fff' },
                formatter: function(params) {
                    let result = `<b>${params[0].axisValue}</b><br/>`;
                    params.forEach(item => {
                        result += `${item.marker} ${item.seriesName}: ${item.value}人<br/>`;
                    });
                    return result;
                }
            },
            legend: {
                orient: mobile ? 'horizontal':'horizontal',
                left: 'center',
                bottom: mobile ? -5 : 0,
                top: 'auto',
                itemGap: mobile ? 6 : 15,
                itemWidth: mobile ? 16 : 25,
                itemHeight: mobile ? 10 : 14,
                textStyle: {
                    color: '#ccc',
                    fontSize: mobile ? 9 : 14
                }
            },
            grid: {
                left: mobile ? '5%' : '3%',
                right: mobile ? '5%' : '3%',
                top: mobile ? '20%' : '20%',
                bottom: mobile ? '7%' : '7%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: times,
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    rotate: mobile ? 45 : 0
                },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    formatter: function(value) {
                        return value;
                    }
                },
                splitLine: { lineStyle: { color: '#333333' } }
            },
            series: series,
            graphic: {
                elements: [{
                    type: 'text',
                    left: mobile ? '4%' : '2%',
                    top: mobile ? '12%' : '10%',
                    style: {
                        text: '增粉数量',
                        fill: '#ffffff',
                        fontSize: mobile ? 10 : 14,
                        fontFamily: 'Helvetica'
                    }
                }]
            }
        };

        line2Chart.setOption(option);
    }

    // 初始化图表3 (增粉图表)
    function initARPUChart() {
        const series = buildARPUSeries();
        const mobile = isMobile();
        const option = {
            textStyle: {
                color: '#ffffff',
                fontFamily: 'Helvetica',
                fontSize: mobile ? 12 : 14
            },
            title: {
                text: titles.arpu,
                left: 'center',
                top: mobile ? 5 : 5,
                textStyle: {
                    color: '#ffffff',
                    fontSize: mobile ? 14 : 16
                }
            },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(50,50,50,0.9)',
                confine:true,
                borderColor: '#777',
                borderWidth: 1,
                textStyle: { color: '#fff' },
                formatter: function(params) {
                    let result = `<b>${params[0].axisValue}</b><br/>`;
                    params.forEach(item => {
                        result += `${item.marker} ${item.seriesName}: ${item.value}<br/>`;
                    });
                    return result;
                }
            },
            legend: {
                orient: mobile ? 'horizontal':'horizontal',
                left: 'center',
                bottom: mobile ? -5 : 0,
                top: 'auto',
                itemGap: mobile ? 6 : 15,
                itemWidth: mobile ? 16 : 25,
                itemHeight: mobile ? 10 : 14,
                textStyle: {
                    color: '#ccc',
                    fontSize: mobile ? 9 : 14
                }
            },
            grid: {
                left: mobile ? '5%' : '3%',
                right: mobile ? '5%' : '3%',
                top: mobile ? '20%' : '20%',
                bottom: mobile ? '7%' : '7%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: times,
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    rotate: mobile ? 45 : 0
                },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    formatter: function(value) {
                        return value;
                    }
                },
                splitLine: { lineStyle: { color: '#333333' } }
            },
            series: series,
            graphic: {
                elements: [{
                    type: 'text',
                    left: mobile ? '4%' : '2%',
                    top: mobile ? '12%' : '10%',
                    style: {
                        text: 'ARPU',
                        fill: '#ffffff',
                        fontSize: mobile ? 10 : 14,
                        fontFamily: 'Helvetica'
                    }
                }]
            }
        };

        line3Chart.setOption(option);
    }

    // 初始化图表4
        function initCCChart() {
        const series = buildCCSeries();
        const mobile = isMobile();
        const option = {
            textStyle: {
                color: '#ffffff',
                fontFamily: 'Helvetica',
                fontSize: mobile ? 12 : 14
            },
            title: {
                text: titles.cc,
                left: 'center',
                top: mobile ? 5 : 5,
                textStyle: {
                    color: '#ffffff',
                    fontSize: mobile ? 14 : 16
                }
            },
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(50,50,50,0.9)',
                borderColor: '#777',
                borderWidth: 1,
                confine:true,
                textStyle: { color: '#fff' },
                formatter: function(params) {
                    let result = `<b>${params[0].axisValue}</b><br/>`;
                    params.forEach(item => {
                        result += `${item.marker} ${item.seriesName}: ${item.value}<br/>`;
                    });
                    return result;
                }
            },
            legend: {
                orient: mobile ? 'horizontal':'horizontal',
                left: 'center',
                bottom: mobile ? -5 : 0,
                top: 'auto',
                itemGap: mobile ? 6 : 15,
                itemWidth: mobile ? 16 : 25,
                itemHeight: mobile ? 10 : 14,
                textStyle: {
                    color: '#ccc',
                    fontSize: mobile ? 9 : 14
                }
            },
            grid: {
                left: mobile ? '5%' : '3%',
                right: mobile ? '5%' : '3%',
                top: mobile ? '20%' : '20%',
                bottom: mobile ? '7%' : '7%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ccTimes,
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    rotate: mobile ? 45 : 0
                },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: '#ffffff' } },
                axisLabel: {
                    color: '#ffffff',
                    fontFamily: 'Helvetica',
                    fontSize: mobile ? 10 : 12,
                    formatter: function(value) {
                        return value;
                    }
                },
                splitLine: { lineStyle: { color: '#333333' } }
            },
            series: series,
            graphic: {
                elements: [{
                    type: 'text',
                    left: mobile ? '4%' : '2%',
                    top: mobile ? '12%' : '10%',
                    style: {
                        text: '咨询数量',
                        fill: '#ffffff',
                        fontSize: mobile ? 10 : 14,
                        fontFamily: 'Helvetica'
                    }
                }]
            }
        };

        line4Chart.setOption(option);
    }

    let initialized = false;

    // 初始化图表并加载数据
    async function initializeApp() {
        const success = await loadDataFile();
        
        initChart();
        initFollowerChart();
        initARPUChart();
        initCCChart();
        
        if (success) {
            updateChart();
            lineChart.setOption({
                title: { text: titles.sales }
            });
            line2Chart.setOption({
                title: { text: CURRENT_ACTIVITY + ' ' + titles.follower }
            });
            line3Chart.setOption({
                title: { text: titles.arpu }
            });
        }
        
        initialized = true;
    }
    
    initializeApp();

    // 监听窗口大小变化，移动端/桌面端切换时重新初始化
    let lastIsMobile = isMobile();
    let resizeTimeout = null;
    window.addEventListener('resize', () => {
        lineChart.resize();
        line2Chart.resize();
        line3Chart.resize();
        line4Chart.resize();
        
        if (!initialized) {
            return;
        }
        
        if (resizeTimeout) {
            clearTimeout(resizeTimeout);
        }
        
        resizeTimeout = setTimeout(() => {
            const currentIsMobile = isMobile();
            if (currentIsMobile !== lastIsMobile) {
                lastIsMobile = currentIsMobile;
                lineChart.clear();
                line2Chart.clear();
                line3Chart.clear();
                line4Chart.clear();
                initChart();
                initFollowerChart();
                initARPUChart();
                initCCChart();
                updateChart();
            }
        }, 300);
    });
</script>
</body>
</html>
